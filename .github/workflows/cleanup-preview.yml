name: Clean up PR preview

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: gaato-net-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Delete trusted static preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - name: Check out trusted cleanup code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Delete preview Worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e7a568f5155a30c39bef74c957811587
          WORKER_NAME: gaato-net-pr-${{ github.event.pull_request.number }}
        run: |
          bun run wrangler delete "$WORKER_NAME" \
            --config wrangler.jsonc \
            --env preview \
            --force

      - name: Record cleanup
        env:
          WORKER_NAME: gaato-net-pr-${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Workers preview cleanup"
            echo
            echo "Requested deletion of \`$WORKER_NAME\`."
          } >> "$GITHUB_STEP_SUMMARY"
