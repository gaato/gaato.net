name: Deploy verified PR preview

on:
  workflow_run:
    workflows: ["Verify and deploy"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: gaato-net-preview-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy trusted static preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - name: Check out trusted deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Download verified static artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-preview-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate artifact and apply trusted preview headers
        run: |
          bun run check:artifacts
          rm -f dist/_headers
          cp public/_headers dist/_headers
          bun run prepare:preview-headers

      - name: Check that the pull request is still open
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          state="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .state)"
          if [[ "$state" == "open" ]]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "PR #$PR_NUMBER is $state; skipping its preview deployment."
          fi

      - name: Deploy preview to Cloudflare Workers
        if: steps.pull-request.outputs.open == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e7a568f5155a30c39bef74c957811587
          WORKER_NAME: gaato-net-pr-${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          ./node_modules/.bin/wrangler deploy \
            --config wrangler.jsonc \
            --env preview \
            --name "$WORKER_NAME" \
            --assets dist
          {
            echo "### Workers preview"
            echo
            echo "Worker: \`$WORKER_NAME\`"
            echo "Search indexing is disabled for this preview."
          } >> "$GITHUB_STEP_SUMMARY"
