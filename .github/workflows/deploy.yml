name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: hustcer/setup-moonbit@v1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - run: bun run check:toolchain

      - run: bun install --frozen-lockfile

      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - run: echo "PUPPETEER_EXECUTABLE_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - run: bun run typecheck

      - run: bun run check:moon

      - run: bun run build

      - run: bun run validate:html

      - run: bun run check:size

      - name: Start preview server
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/gaato-net-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gaato-net-preview.log
          exit 1

      - run: bun run check:a11y

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir ${{ github.workspace }}/dist --accept 200,204,206,429 dist/index.html README.md dist/sitemap.xml dist/robots.txt dist/site.webmanifest

      - name: Deploy preview to Cloudflare Workers
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e7a568f5155a30c39bef74c957811587
          WORKER_NAME: gaato-net-pr-${{ github.event.number }}
        run: |
          bun run wrangler deploy --env preview --name "$WORKER_NAME"
          {
            echo "### Workers preview"
            echo ""
            echo "Worker: \`$WORKER_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production to Cloudflare Workers
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e7a568f5155a30c39bef74c957811587
        run: |
          bun run wrangler deploy --env=""
          {
            echo "### Workers production"
            echo ""
            echo "Worker: \`gaato-net\`"
            echo "Production route is managed by the iac repository."
          } >> "$GITHUB_STEP_SUMMARY"
