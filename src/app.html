<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#171714" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link
			rel="icon"
			href="%sveltekit.assets%/favicon-32x32.png"
			type="image/png"
			sizes="32x32"
		/>
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/apple-touch-icon.png"
			sizes="180x180"
		/>
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link
			rel="alternate"
			type="application/rss+xml"
			title="gaato — Articles"
			href="%sveltekit.assets%/feed.xml"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="svelte">%sveltekit.body%</div>
	</body>
</html>
