<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#171714" media="(prefers-color-scheme: dark)" />
		<script>
			{
				try {
					const colorScheme = localStorage.getItem('gaato:color-scheme:v1');
					if (colorScheme === 'light' || colorScheme === 'dark') {
						document.documentElement.dataset.colorScheme = colorScheme;
						document.querySelector('meta[name="color-scheme"]').content = colorScheme;
						const themeColor = colorScheme === 'dark' ? '#171714' : '#f4f1e8';
						for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
							meta.content = themeColor;
						}
					}
				} catch {
					// The system color scheme remains the safe default when storage is unavailable.
				}
			}
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link
			rel="icon"
			href="%sveltekit.assets%/favicon-32x32.png"
			type="image/png"
			sizes="32x32"
		/>
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/apple-touch-icon.png"
			sizes="180x180"
		/>
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link
			rel="alternate"
			type="application/rss+xml"
			title="gaato — Articles"
			href="%sveltekit.assets%/feed.xml"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="svelte">%sveltekit.body%</div>
	</body>
</html>
